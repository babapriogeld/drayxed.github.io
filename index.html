<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacked By Drayxed</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05050a;
            color: #fff;
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(8, 8, 16, 0.93), rgba(8, 8, 16, 0.93)),
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(120, 0, 255, 0.025) 2px,
                    rgba(120, 0, 255, 0.025) 4px
                );
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 27px;
        }

.wrapper img {
    width: 390px;
    max-width: 88vw;
    height: auto;
    display: block;
    border-radius: 6px;
    border: 1px solid #2a2a3a;
    box-shadow: 0 0 28px rgba(140, 40, 255, 0.22);
}

        .header {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .header span {
            color: #b44aff;
        }

        .subtitle {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.18rem;
            color: #ccc;
            letter-spacing: 1px;
            margin-top: -6px;
        }

        .footer {
            margin-top: 8px;
            font-size: 1.02rem;
            color: #777;
            line-height: 1.7;
        }

        .footer a {
            color: #9b6bff;
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #c9a6ff;
        }

        @media (max-width: 480px) {
            .wrapper {
                transform: scale(0.97);
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <img
            src="https://d98mx5cjxqjp7a.archive.vn/EQdQP/cc8e2e769ec47bb2c1ce9f949ad81a92d140e719.webp"
            alt="deface"
        >

        <div class="header">
            Hacked by <span>Drayxed</span>
        </div>

        <div class="subtitle">CPLC El Koydu :D</div>

        <div class="footer">
            Discord Adresimize Katılın<br>
            <a href="https://discord.gg/cplc" target="_blank" rel="noopener noreferrer">discord.gg/cplc</a>
        </div>
    </div>
</body>
</html>
